name: Build index.json

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "categories.json"
      - "files/**"
      - "icons/**"
      - "tools/**"
      - "mirror/map.json"
      - ".github/workflows/build-index.yml"
  schedule:
    - cron: "17 */6 * * *"   # refresh sha256 of external files every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index (signed)
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: python3 tools/build_index.py --require-signature
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name  "enigmaplay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json [skip ci]"
          if ! git push; then
            # main moved while we were building (e.g. two admin commits in a row): the newer commit
            # starts its own build, which includes this change, so this run can stop here.
            echo "::notice::main moved during the build; the newer run publishes the index"
            exit 0
          fi
