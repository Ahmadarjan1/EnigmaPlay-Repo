name: Move mirror tags to the current commit (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for t in $(git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}'); do
            git push -f origin "HEAD:$t"
          done
          git ls-remote --tags origin
