name: Sync plugins from their authors' repos

on:
  schedule:
    - cron: "23 * * * *"        # every hour
  workflow_dispatch:
    inputs:
      only:
        description: "Only this plugin id (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check upstream versions
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python3 tools/sync_sources.py --only "${{ github.event.inputs.only }}"
          else
            python3 tools/sync_sources.py
          fi
      - name: Rebuild signed index and push
        if: steps.sync.outputs.changed == '1'
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          git config user.name "enigmaplay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/build_index.py --require-signature
          git add -A packages files index.json
          git commit -m "${{ steps.sync.outputs.message }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
