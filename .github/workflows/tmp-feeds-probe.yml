name: tmp feeds probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request as u, re
          def get(url):
              try:
                  r = u.urlopen(u.Request(url, headers={"User-Agent": "Mozilla/5.0 EnigmaPlay"}), timeout=25)
                  return r.status, r.read()
              except Exception as e:
                  return str(e)[:60], b""
          def links(url, pat=rb'href="([^"]+)"'):
              st, b = get(url)
              return st, [l.decode('utf-8','replace').replace('&amp;','&') for l in re.findall(pat, b)]
          for d in ["7.6/octagon/", "7.6/novaler/", "7.6/gigablue/"]:
              st, l = links("https://pur-e2.club/OU/images/index.php?dir=" + d)
              l = [x for x in l if "sort=" not in x]
              print("::notice::pure %s %s || %s" % (d, st, " | ".join(l[8:60])[:1800]))
          st, l = links("https://pur-e2.club/OU/images/index.php?dir=")
          print("::notice::pure root %s || %s" % (st, " | ".join(x for x in l if "dir=" in x and "sort" not in x)[:600]))
          for p in ["/downloads/enigma2/multibox-4k-se-ultra-hd", "/downloads/enigma2-backups2/multibox-4k-ultra-hd", "/downloads/enigma2"]:
              st, l = links("https://www.novaler.com" + p)
              print("::notice::novaler %s %s || %s" % (p, st, " | ".join(x for x in l if "/uploads/" in x or "/downloads/enigma2" in x)[:1800]))
          PY
          python3 p.py
