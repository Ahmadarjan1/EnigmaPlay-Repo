name: tmp feeds probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request as u, re
          def get(url):
              try:
                  r = u.urlopen(u.Request(url, headers={"User-Agent": "EnigmaPlay"}), timeout=25)
                  return r.status, r.read()
              except Exception as e:
                  return str(e)[:60], b""
          feeds = {
            "openhdf": "https://flash.hdfreaks.cc/openhdf/json/%s",
            "opendroid": "https://opendroid.org/json/%s",
            "egami": "https://image.egami-image.com/json/%s",
            "openspa": "https://openspa.webhop.info/online/json.php?box=%s",
            "openvision": "https://images.openvision.dedyn.io/json/%s",
            "teamblue": "https://images.teamblue.tech/json/%s",
            "open8eight": "http://openeight.de/json/%s",
          }
          for fid, f in feeds.items():
              for m in ["sf8008", "gbquad4k", "h7", "vuduo4k", "multibox"]:
                  st, b = get(f % m)
                  info = ""
                  try:
                      d = json.loads(b)
                      cats = list(d)[:2]
                      n = sum(len(v) for v in d.values() if isinstance(v, dict))
                      first = next(iter(d[cats[0]].values())) if cats else {}
                      info = "n=%d cats=%s first=%s" % (n, cats, json.dumps(first)[:220])
                  except Exception as e:
                      info = "notjson %r" % b[:80]
                  print("::notice::%s %s %s %s" % (fid, m, st, info))
          for url in ["https://www.pur-e2.club", "https://pur-e2.club", "https://www.vuplus-support.org/wbb4/index.php", "https://images.openvision.dedyn.io/", "https://www.novaler.com/"]:
              st, b = get(url)
              links = sorted(set(re.findall(rb'href="([^"]*(?:image|Image|json|download|Download|zip)[^"]*)"', b)))[:12]
              print("::notice::page %s %s %s" % (url, st, [l.decode('utf-8','replace') for l in links]))
          PY
          python3 p.py
