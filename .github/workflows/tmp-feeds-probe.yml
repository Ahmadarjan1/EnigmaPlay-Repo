name: tmp feeds probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import urllib.request as u, re
          def get(url):
              try:
                  r = u.urlopen(u.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
                  return r.status, r.geturl(), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e)[:60], url, ""
          def show(url, n=1500, flt=None):
              st, fin, b = get(url)
              l = [x.replace("&amp;", "&") for x in re.findall(r'href="([^"]+)"', b)]
              if flt: l = [x for x in l if re.search(flt, x)]
              print("::notice::%s -> %s %s (%d links) || %s" % (url, fin, st, len(l), " | ".join(l)[:n]))
              return l
          show("https://opendroid.org/")
          l = show("https://opendroid.org/version-8.1.2/", flt="zip|/|index")
          l2 = show("https://opendroid.org/version-8.1.2/index.php")
          for x in ("https://opendroid.org/8.1.2/", "https://opendroid.org/8.1/", "https://opendroid.org/version-8.1/"):
              show(x)
          PY
          python3 p.py
