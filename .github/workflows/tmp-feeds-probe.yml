name: tmp feeds probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import urllib.request as u, re
          def get(url):
              try:
                  r = u.urlopen(u.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
                  return r.status, r.geturl(), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e)[:60], url, ""
          def show(url, n=1500, flt=None):
              st, fin, b = get(url)
              l = [x.replace("&amp;", "&") for x in re.findall(r'href="([^"]+)"', b)]
              if flt: l = [x for x in l if re.search(flt, x)]
              print("::notice::%s -> %s %s (%d links) || %s" % (url, fin, st, len(l), " | ".join(l)[:n]))
              return l
          l = show("https://opendroid.org/8.1.2/Octagon/")
          sub = [x for x in l if not x.startswith("http") and x not in ("favicon.ico",) and not x.startswith("?") and not x.startswith("/")]
          for x in sub[:3]:
              l2 = show("https://opendroid.org/8.1.2/Octagon/" + x)
              for y in [y for y in l2 if not y.startswith("http") and not y.startswith("?") and not y.startswith("/")][:2]:
                  show("https://opendroid.org/8.1.2/Octagon/" + x + y)
          show("https://opendroid.org/8.1.2/GigaBlue/")
          PY
          python3 p.py
