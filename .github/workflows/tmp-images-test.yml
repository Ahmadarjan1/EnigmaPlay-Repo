name: tmp images test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p m/EnigmaPlay && touch m/EnigmaPlay/__init__.py && echo '' | base64 -d > m/EnigmaPlay/imagesdl.py
          cat > t.py <<'PY'
          import sys, time, os
          sys.path.insert(0, "m")
          from EnigmaPlay import imagesdl as dl
          for model in ["sf8008"]:
              res = dl.load_all(None, [model])
              for r in res:
                  l = r["latest"]
                  print("::notice::%s model=%s n=%d latest=[%s] %s" % (r["feed"]["id"], r["model"], len(r["entries"]), l["category"], l["link"]))
              missing = set(f["id"] for f in dl.feeds(None)) - set(r["feed"]["id"] for r in res)
              print("::notice::no images from: %s" % ",".join(sorted(missing)))
          import json
          from urllib.request import urlopen
          raw = json.load(urlopen("https://www.openvix.co.uk/json/sf8008"))
          for c in list(raw)[:3]:
              ks = list(raw[c])[:2]
              print("::notice::vix raw [%s] %s" % (c, [raw[c][k] for k in ks]))
          r = [x for x in res if x["feed"]["id"] == "openvix"][0]
          job = dl.Download(r["latest"], "/tmp/media/imagebackups")
          job.start(); t0 = time.time()
          while job.state == "running" and time.time() - t0 < 600: time.sleep(2)
          print("::notice::download state=%s err=%s bytes=%d total=%d secs=%d exists=%s" % (job.state, job.error, job.done, job.total, time.time()-t0, os.path.exists(job.target)))
          PY
          python3 t.py
