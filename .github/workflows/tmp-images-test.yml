name: tmp images test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p m/EnigmaPlay && touch m/EnigmaPlay/__init__.py && echo '' | base64 -d > m/EnigmaPlay/imagesdl.py
          cat > t.py <<'PY'
          import sys, time, os, json
          sys.path.insert(0, "m")
          from EnigmaPlay import imagesdl as dl
          idx = json.load(open("index.json"))
          class C: pass
          c = C(); c.image_feeds = idx["image_feeds"]; c.image_models = idx["image_models"]
          for model in ["sf8008", "novaler4k", "gbquad4k", "vuduo4k", "zgemmah7"]:
              res = dl.load_all(c, [model])
              print("::notice::%s || %s" % (model, " || ".join("%s(%s) n=%d latest=%s" % (r["feed"]["id"], r["model"], len(r["entries"]), r["latest"]["file"]) for r in res)))
          res = dl.load_all(c, ["sf8008"])
          for fid in ("pure2", "openspa"):
              r = [x for x in res if x["feed"]["id"] == fid]
              if not r: print("::notice::%s missing" % fid); continue
              job = dl.Download(r[0]["latest"], "/tmp/media/imagebackups"); job.start(); t0 = time.time()
              while job.state == "running" and time.time() - t0 < 600: time.sleep(2)
              print("::notice::download %s state=%s err=%s bytes=%d" % (fid, job.state, job.error, job.done))
          PY
          python3 t.py
