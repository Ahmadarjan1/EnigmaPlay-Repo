name: tmp site check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" https://www.novaler.com/dz/downloads/plugins -o p.html
          python3 - <<'PY'
          import re
          b=open("p.html",encoding="utf-8",errors="replace").read()
          i=b.find("/uploads/plugins/enigma2-plugin-extensions-ajpanel")
          j=b.rfind("thumb_",0,i)
          seg=re.sub(r"\s+"," ",b[j-1200:i+600])
          print("::notice::card " + seg)
          i=b.find("/uploads/plugins/KeyAdder")
          print("::notice::card2 " + re.sub(r"\s+"," ",b[i-1500:i+300]))
          PY
