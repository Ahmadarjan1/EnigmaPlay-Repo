name: tmp site check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" https://www.novaler.com/dz/downloads/plugins -o p.html
          python3 - <<'PY'
          import re
          b=open("p.html",encoding="utf-8",errors="replace").read()
          print("::notice::size %d zips %s" % (len(b), sorted(set(re.findall(r'href="([^"]+\.(?:ipk|zip|deb|tar\.gz|sh))"', b)))[:60]))
          body=b[b.find("<main"):] if "<main" in b else b
          txt=re.sub(r"\s+"," ",re.sub(r"<script.*?</script>|<style.*?</style>","",body,flags=re.S))
          i=txt.find("uploads")
          print("::notice::snippet " + txt[max(0,i-1500):i+2500])
          print("::notice::imgs %s" % sorted(set(re.findall(r'src="([^"]+\.(?:png|jpg|jpeg|webp|gif))"', b)))[:60])
          PY
