name: tmp site check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import urllib.request as u, re, json, glob
          def links(url):
              b = u.urlopen(u.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=40).read().decode("utf-8", "replace")
              return set(re.findall(r'href="(/uploads/[^"]+\.zip)"', b))
          out = []
          for slug in ["multibox-4k-pro-ultra-hd", "multibox-4k-se-ultra-hd", "multibox-4k-ultra-hd"]:
              dz = links("https://www.novaler.com/dz/downloads/enigma2/" + slug)
              plain = links("https://www.novaler.com/downloads/enigma2/" + slug)
              bk = links("https://www.novaler.com/downloads/enigma2-backups2/" + slug)
              out.append("%s dz=%d plain=%d backups=%d dz-not-in-ours=%d" % (slug, len(dz), len(plain), len(bk), len(dz - plain - bk)))
          print("::notice::" + " || ".join(out))
          PY
          python3 p.py
