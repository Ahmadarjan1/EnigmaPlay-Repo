name: tmp site check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://enigmaplay-api.ahmadalarjan2.workers.dev
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          H=$(curl -s -A "$UA" -D - -o /tmp/s.xml $B/sitemap.xml | tr -d '\r' | grep -iE "^HTTP|content-type|location|x-robots" | tr '\n' ' ')
          echo "::notice::sitemap $H size=$(wc -c </tmp/s.xml) urls=$(grep -c '<loc>' /tmp/s.xml) first=$(grep -o '<loc>[^<]*' /tmp/s.xml | head -2 | tr '\n' ' ') head=$(head -c 120 /tmp/s.xml | tr '\n' ' ')"
          echo "::notice::robots $(curl -s -A "$UA" $B/robots.txt | tr '\n' ' ')"
